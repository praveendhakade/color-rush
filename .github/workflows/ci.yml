name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate Expo application configuration
        run: npx expo config --type public
      - name: Bundle Android application for build validation
        run: npx expo export --platform android --no-bytecode --output-dir "$RUNNER_TEMP/expo-export"
